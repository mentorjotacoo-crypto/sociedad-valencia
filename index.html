  function b64(x) { return Uint8Array.from(atob(x), function (c) { return c.charCodeAt(0); }); }
  async function abrir(llaveBytes) {
    var llave = await crypto.subtle.importKey("raw", llaveBytes, "AES-GCM", false, ["decrypt"]);
    var plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(D.i) }, llave, b64(D.d));
    var html = new TextDecoder().decode(plano);
    // El tablero trae su propio candado (hash en el navegador): ya se pasó este, se abre directo.
    try { sessionStorage.setItem("sv_auth", "1"); } catch (e) {}
    document.open(); document.write(html); document.close();
  }
  async function derivar(clave) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave), "PBKDF2", false, ["deriveBits"]);
    var bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(D.s), iterations: D.n }, base, 256);
    return new Uint8Array(bits);
  }
  // Misma pestaña: la llave derivada (no la contraseña) queda en sessionStorage para recargar sin volver a escribirla.
  try {
    var g = sessionStorage.getItem("sv_llave_" + D.s);
    if (g) { abrir(b64(g)).catch(function () { sessionStorage.removeItem("sv_llave_" + D.s); }); }
  } catch (e) {}
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var btn = document.getElementById("b"), err = document.getElementById("e");
    btn.disabled = true; err.textContent = "Abriendo…";
    try {
      var k = await derivar(document.getElementById("c").value);
      try { sessionStorage.setItem("sv_llave_" + D.s, btoa(String.fromCharCode.apply(null, k))); } catch (e) {}
      await abrir(k);
    } catch (e) {
      try { sessionStorage.removeItem("sv_llave_" + D.s); } catch (x) {}
      err.textContent = "Contraseña incorrecta"; btn.disabled = false;
    }
  });
})();
